name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust tests
        run: cargo test

      - name: WASM drift check
        run: |
          cargo build --target wasm32-unknown-unknown --release
          if ! diff -q target/wasm32-unknown-unknown/release/wterm.wasm packages/@wterm/core/wasm/wterm.wasm > /dev/null 2>&1; then
            echo "::error::Committed wterm.wasm does not match Rust sources. Rebuild with 'pnpm build:wasm' and commit the updated packages/@wterm/core/wasm/wterm.wasm."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
